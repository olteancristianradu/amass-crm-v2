# CodeQL — GitHub-native static analysis for security vulnerabilities.
# Runs on every push to main + every PR + weekly cron sweep.
# Free for public repositories. Findings appear in Security tab.
name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 06:00 UTC — weekly drift sweep

permissions:
  actions: read
  contents: read
  security-events: write  # required to upload SARIF results to Security tab

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']  # covers both .ts and .tsx
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4f3212b61783c3c68e8309a0f18a699764811cda  # v3.27.1
        with:
          languages: ${{ matrix.language }}
          # security-extended adds checks beyond default set (CWE/OWASP coverage)
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@4f3212b61783c3c68e8309a0f18a699764811cda  # v3.27.1
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4f3212b61783c3c68e8309a0f18a699764811cda  # v3.27.1
        with:
          category: "/language:${{ matrix.language }}"
