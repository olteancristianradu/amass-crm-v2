name: Secret Scan

# SEC-003: scan every push and PR for committed secrets using gitleaks.
# A leaked AWS/Stripe/Anthropic/Twilio key in main is a P0 incident — much
# cheaper to catch in CI than to rotate after the fact.
on:
  push:
    branches: [main]
  pull_request:
  # Weekly scheduled scan catches secrets that were merged before this
  # workflow existed and lets us fix them lazily instead of force-pushing.
  schedule:
    - cron: '0 6 * * 1'  # Mondays at 06:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (fetch full history for scheduled scans)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      # Pinned to a specific release SHA — avoids the supply-chain risk of
      # `gitleaks/gitleaks-action@v2` retag.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE — the action runs in OSS mode for public
          # repos and self-hosted single-org repos. If the org grows, set
          # GITLEAKS_LICENSE in repo secrets to enable PR comments.
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
