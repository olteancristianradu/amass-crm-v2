name: Red Team Weekly

# Weekly adversarial scan: dependency audit + multi-tenant RLS regression
# + secret history scan + CodeQL refresh. The dedicated agent (Claude Code
# in screen -S amass-redteam) runs targeted probes against the demo URL;
# this workflow is the unattended baseline.

on:
  schedule:
    # Saturday 02:00 UTC — quiet window, before Monday review.
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit-strict:
    name: pnpm audit (high+critical, prod only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production deps for HIGH/CRITICAL (with allowlist)
        # Allowlist mirrors .github/workflows/ci.yml dependency-audit step.
        # See that step for the rationale per ID.
        run: |
          set -o pipefail
          ALLOWLIST='1118053'
          OUT=$(pnpm audit --prod --audit-level=high --json || true)
          REMAINING=$(echo "$OUT" | jq -r --arg list "$ALLOWLIST" '
            .actions[]?.resolves[]?.id
            | select(. != null)
            | . as $id
            | select(($list | split(",") | map(tonumber) | contains([$id])) | not)
          ')
          if [ -n "$REMAINING" ]; then
            echo "::error::Unhandled HIGH/CRITICAL audit findings:"
            echo "$REMAINING"
            echo "$OUT" | jq .
            exit 1
          fi
          echo "Audit clean (allowlisted IDs filtered: $ALLOWLIST)"

  rls-regression-baseline:
    name: RLS multi-tenant regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # pgvector image — the init migration creates a `vector` extension.
        # Plain postgres:16 fails with "extension vector is not available"
        # when migrate deploy runs the first migration.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: amass_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/amass_crm?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-min-32-chars-padding
      JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars-pad
      ENCRYPTION_KEY: ci-test-encryption-key-64-hex-chars-padding-padding-padding-pad
      AI_WORKER_SECRET: ci-test-ai-worker-secret-min-32-chars-pad
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amass/shared build
      - run: pnpm --filter @amass/api exec prisma generate
      - run: pnpm --filter @amass/api exec prisma migrate deploy
      - name: Run multi-tenant isolation regression
        run: pnpm --filter @amass/api exec vitest run test/multi-tenant.e2e.spec.ts

  gitleaks-history:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_SUMMARY: true
