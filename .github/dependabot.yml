# Dependabot — daily check for outdated/vulnerable deps. Auto-opens PRs.
# Grouped to avoid PR spam: only major bumps + security alerts trigger separate PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    groups:
      # Group all minor + patch bumps into one PR per week
      minor-and-patch:
        applies-to: version-updates
        update-types: ['minor', 'patch']
      # Security alerts always get their own PR (highest priority)
      security:
        applies-to: security-updates
        patterns: ['*']
    labels: ['dependencies']
    commit-message:
      prefix: 'chore(deps)'
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Bucharest
    open-pull-requests-limit: 0
    labels: ['ci']
    commit-message:
      prefix: 'chore(ci)'
