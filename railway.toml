# Repo-root Railway config — intentionally minimal.
#
# This monorepo ships 3 deployable services: `api`, `web`, `ai-worker`.
# Each MUST be its own Railway service. Railway's config-as-code is
# per-service (one `railway.toml` per service), so this file only exists
# to give Railway's repo-level auto-detection something sane to read and
# to keep settings comments in one place.
#
# Per-service config lives at:
#   apps/api/railway.toml
#   apps/web/railway.toml
#   apps/ai-worker/railway.toml
#
# Railway dashboard wiring (do this once per service when you `railway init`):
#
#   Settings → Source → Root Directory   = (leave EMPTY / blank — repo root)
#   Settings → Config-as-Code Path       = apps/<svc>/railway.toml
#   Settings → Watch Paths               = apps/<svc>/**, packages/shared/**
#
# WHY Root Directory must be blank:
#   The pnpm workspace requires the repo root in the build context so that
#   `@amass/shared` resolves. Each Dockerfile expects to COPY from
#   `packages/shared/`. Railway uses the Root Directory as the Docker build
#   context — there is NO separate `buildContextPath` field — so the only
#   way to get the workspace into the image is to keep the root blank and
#   point `dockerfilePath` at `apps/<svc>/Dockerfile` from there.
#
# Things Railway does NOT support (don't waste time trying):
#   • the `[[services]]` table-array form (silently ignored)
#   • `buildContextPath` (build context = Root Directory, always)
#   • Listing multiple services in one toml file
#
# Managed dependencies you must provision on Railway (per docs/RAILWAY_DEPLOY.md):
#   • Postgres (managed addon — exposes DATABASE_URL automatically)
#   • Redis    (managed addon — exposes REDIS_URL automatically)
#   • Object storage for MinIO replacement: Cloudflare R2 or Backblaze B2
#     (Railway has no managed S3-compatible store).
#
# See `docs/RAILWAY_DEPLOY.md` for the full deploy procedure.

[build]
# DOCKERFILE is the only builder we use — every service has a hand-tuned
# multi-stage Dockerfile. NIXPACKS would re-detect the stack and ignore
# the workspace.
builder = "DOCKERFILE"

[deploy]
# Default safety net for a misconfigured service at the repo level. The
# per-service tomls override these with their specific healthcheck paths.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
