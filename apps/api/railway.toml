# Railway config for the `api` service (NestJS 11 + Prisma 6).
#
# Dashboard wiring:
#   Settings → Source → Root Directory   = (leave EMPTY / blank — repo root)
#   Settings → Config-as-Code Path       = apps/api/railway.toml
#   Settings → Watch Paths               = apps/api/**, packages/shared/**
#
# Railway does NOT support a custom build context path. The build context is
# always the Root Directory. That's why Root Directory must be empty here —
# the Dockerfile COPYs from `packages/shared/` (pnpm workspace).
#
# ─────────────────────────────────────────────────────────────────────
# Required env vars (set in Railway dashboard → Variables tab):
#
#   DATABASE_URL                 # auto-injected by the Postgres addon
#   REDIS_URL                    # auto-injected by the Redis addon
#   JWT_SECRET                   # ≥32 chars in prod. Generate:
#                                #   node -e "console.log(require('crypto').randomBytes(48).toString('hex'))"
#   JWT_REFRESH_SECRET           # ≥32 chars in prod (separate from JWT_SECRET)
#   ENCRYPTION_KEY               # exactly 64 hex chars (32 bytes). Generate:
#                                #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   NODE_ENV=production          # turns on prod-only checks in env.ts
#   CORS_ALLOWED_ORIGINS         # e.g. "https://app.amass-crm.com" — no "*" in prod
#   AI_WORKER_SECRET             # ≥16 chars; required in prod (env.ts:274). Generate:
#                                #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#
# Object storage (MinIO replacement on Railway — recommend Cloudflare R2):
#   MINIO_ENDPOINT               # e.g. https://<accountid>.r2.cloudflarestorage.com
#   MINIO_ACCESS_KEY             # R2 / B2 access key id
#   MINIO_SECRET_KEY             # R2 / B2 secret access key
#   MINIO_BUCKET                 # bucket name (e.g. "amass-files-prod")
#   MINIO_PUBLIC_URL             # public URL for presigned downloads
#                                # (R2 public bucket URL or a custom domain)
#
# Recommended (all default to disabled if empty):
#   PUBLIC_API_BASE_URL          # e.g. "https://api.amass-crm.com" — used in email tracking links
#   METRICS_AUTH_TOKEN           # ≥16 chars bearer for /metrics scrape (or set METRICS_ALLOWED_IPS)
#   SENTRY_DSN                   # error reporting
#   LOG_LEVEL=info
#
# Optional integrations (leave empty to disable; see apps/api/src/config/env.ts
# for the full schema — env.ts is the single source of truth):
#   TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN, TWILIO_WEBHOOK_BASE_URL, TWILIO_SMS_FROM
#   ANTHROPIC_API_KEY, OPENAI_API_KEY, GEMINI_API_KEY
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
#   SIEM_WEBHOOK_URL, AUDIT_RETENTION_DAYS_DEFAULT (defaults to 2555 ≈ 7y)
#   DATABASE_REPLICA_URL, PGBOUNCER_URL (scaling — opt-in)
#
# Anti-footgun (rejected by prodOnlyChecks in env.ts):
#   • CORS_ALLOWED_ORIGINS must NOT contain "*"
#   • MINIO_ACCESS_KEY / MINIO_SECRET_KEY must NOT be "minioadmin"
#   • JWT_SECRET / JWT_REFRESH_SECRET must be ≥32 chars
#   • WEBHOOK_TRUSTED_HOSTS must be empty
#   • METRICS_ALLOWED_IPS or METRICS_AUTH_TOKEN must be set
#
# Pre-deploy validation: `scripts/check-railway-readiness.sh`
# ─────────────────────────────────────────────────────────────────────

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
# Only redeploy when the api or shared workspace changes. Without this,
# every web/ai-worker push triggers a (long) Prisma-generating rebuild.
watchPatterns = ["apps/api/**", "packages/shared/**", "pnpm-lock.yaml"]

[deploy]
# Dockerfile's CMD is `node dist/main.js` from /repo/apps/api. Repeated here
# so Railway shows the actual start command in the deploy log.
startCommand = "node dist/main.js"
# `/api/v1/health` — public liveness probe (HealthController @ apps/api/src/modules/health/health.controller.ts).
# Global prefix `api/v1` is set in main.ts. `@Public()` skips auth.
healthcheckPath = "/api/v1/health"
# Cold start: Prisma client init + DB pool warmup typically takes 8–15s.
# Give it 60s before Railway declares the deploy failed.
healthcheckTimeout = 60
# Restart on crash (e.g. transient DB blip) up to 3x, then mark the deploy
# failed so Railway routes traffic back to the previous deploy.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
